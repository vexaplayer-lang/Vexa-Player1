<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vexa Player</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <img src="icon.png">
      <span>VEXA PLAYER</span>
    </div>
    <div class="menu">
      <div class="item selected" tabindex="0">📺　Canlı TV</div>
      <div class="item" tabindex="0">🎬　Filmler</div>
      <div class="item" tabindex="0">📂　Diziler</div>
      <div class="item" tabindex="0">⚙️　Ayarlar</div>
    </div>
    <div class="footer">Vexa Player · TV Edition</div>
  </aside>

  <main>
    <header>
      <div class="heading">Vexa Player <small>CANLI YAYIN</small></div>
      <div class="clock" id="clock"></div>
    </header>

    <section class="content">
      <div class="player">
        <div class="play-icon">▶</div>
        <h2>Vexa Player</h2>
        <p>Canlı yayın keyfinin yeni adresi</p>
        <span class="hint">Kanal seçerek başlayın</span>
      </div>

      <div class="channels">
        <h2>Kanallar</h2>
        <div class="channel selected" tabindex="0">01　📺　Kanal 1</div>
        <div class="channel" tabindex="0">02　📺　Kanal 2</div>
        <div class="channel" tabindex="0">03　📺　Kanal 3</div>
        <div class="channel" tabindex="0">04　📺　Kanal 4</div>
        <div class="channel" tabindex="0">05　📺　Kanal 5</div>
        <div class="channel" tabindex="0">06　📺　Kanal 6</div>
      </div>
    </section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
